name: Birches Health
description: 'Birches Health is a fully virtual behavioral addiction treatment provider
  specializing in gambling disorder and related compulsive behaviors such as sports
  betting, day trading, video gaming, and pornography. Founded in 2023 and headquartered
  in Phoenix, Arizona, the company delivers confidential online care from licensed
  gambling counselors, peer mentors, financial coaches, and group therapy across all
  50 states. Birches Health partners with 18+ state governments that have legalized
  sports betting and 100+ national insurance plans (including UnitedHealthcare, Cigna,
  Aetna, and Blue Cross Blue Shield) so most clients pay $0-25 per session, with a
  core program completed in about 12 weeks. The company has raised approximately $20M
  from AlleyCorp, General Catalyst, and Will Ventures. Birches Health does not currently
  publish a public developer API, portal, or specification; this profile captures its
  identity and public web surface.'
